<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页收藏家</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- 统一的 Tailwind 配置 -->
    <style>
     @import url("https://fontsapi.zeoseven.com/806/main/result.css");
     </style>
    
     <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // 【优化：极简 Ins 灰调柔光配色】
                        primary: '#BDC8DE', // 柔和淡蓝色（强调色）
                        secondary: '#f8f9fa', // 柔和中灰（辅助色）
                        neutral: {
                            100: '#F5F5F5', // 浅色背景 (米白)
                            200: '#E8E8E8', // 浅色卡片背景 (浅灰)
                            300: '#D1D5DB', // 边框
                            400: '#A3A3A3', // 浅文字/占位符
                            500: '#737373',
                            600: '#525252',
                            700: '#404040',
                            800: '#383838', // 深色模式卡片背景
                            900: '#262626', // 深色模式背景 / 浅色模式文字 (深炭灰)
                        }
                    },
                    fontFamily: {
                        sans: ['NanoMyongWenFangSong', 'Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-in-out',
                        'pulse-soft': 'pulseSoft 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.8' },
                        },
                    },
                    boxShadow: {
                        // 调整阴影，使其更柔和
                        'soft': '0 2px 8px rgba(0, 0, 0, 0.05)',
                        'hover': '0 6px 15px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .glass-effect {
                /* 使用更柔和的米白色和深炭灰 */
                @apply bg-neutral-100 bg-opacity-70 dark:bg-neutral-900 dark:bg-opacity-70 backdrop-blur-md;
            }
            .card-hover {
                @apply transition-all duration-300 hover:shadow-hover hover:-translate-y-1;
            }
            .btn-primary {
                @apply bg-primary text-white px-4 py-2 rounded-2xl shadow-md hover:bg-opacity-90 transition-all duration-300 flex items-center justify-center gap-2;
            }
            .btn-secondary {
                /* 调整圆角 */
                @apply bg-white dark:bg-neutral-800 text-neutral-700 dark:text-neutral-200 px-4 py-2 rounded-2xl shadow-soft hover:shadow-md transition-all duration-300 flex items-center justify-center gap-2;
            }
            .input-field {
                /* 调整圆角 */
                @apply w-full px-2 py-2 rounded-xl border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300;
            }
            .search-input-field {
                @apply w-full py-2.5 rounded-lg border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300;
    /* 搜索框 注意：没有 px-4 */
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .tag {
                /* 标签使用 primary 颜色，但背景使用 neutral.50 作为卡片背景的对比 */
                @apply px-2.5 py-0.5 rounded-full text-xs font-medium bg-neutral-50 text-primary dark:bg-neutral-600 dark:text-neutral-200 cursor-pointer transition-all;
            }
            .tag-active {
                @apply bg-primary text-white;
            }
            .fullscreen-backdrop {
                @apply fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4;
            }
            .fullscreen-content {
                /* 调整圆角 */
                @apply bg-white dark:bg-neutral-800 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col animate-slide-up;
            }
            .code-fullscreen-btn {
                @apply absolute bottom-3 right-3 text-neutral-500 hover:text-primary transition-colors p-2 rounded-full hover:bg-neutral-100 dark:hover:bg-neutral-700;
            }

            /* 【优化】自定义下拉菜单向上弹出样式 */
            .dropdown-up {
                @apply bottom-full mb-2 mt-0;
            }
            
            /* 【新增】批量编辑悬浮栏样式 */
            .bulk-edit-bar {
                /* 修复 BUG 1：默认隐藏在屏幕下方 */
                @apply fixed bottom-0 left-0 right-0 z-50 bg-primary shadow-lg transition-all duration-300 transform translate-y-full;
            }
            .bulk-edit-bar.active {
                /* 修复 BUG 1：激活时向上移动到屏幕内 */
                @apply translate-y-0;
            }
            
            /* 【新增】代码全屏模式的样式 - 修正：删除绝对定位以避免与 Tab 按钮重叠 */
            .code-controls {
                @apply p-1 flex gap-1 z-10; /* 仅保留样式，移除 absolute top-0 right-0 */
            }
            .code-control-btn {
                @apply p-2 rounded-full text-neutral-500 hover:text-primary hover:bg-neutral-200 dark:hover:bg-neutral-700 transition-colors;
            }
        }
    </style>
</head>
<body class="bg-neutral-100 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100 min-h-screen transition-colors duration-300">
    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 glass-effect border-b border-neutral-200 dark:border-neutral-800 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa fa-bookmark text-primary text-2xl"></i>
                <h1 class="text-xl font-bold text-neutral-900 dark:text-neutral-100">网页收藏家</h1>
            </div>
            <div class="flex items-center gap-3">
                <!-- 【新增】批量编辑按钮 (修复 BUG 3) -->
                <button id="toggle-bulk-edit-btn" class="p-2 rounded-full hover:bg-neutral-200 dark:hover:bg-neutral-800 transition-colors">
                    <i class="fa fa-list-ul text-neutral-700 dark:text-neutral-300"></i>
                </button>
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-neutral-200 dark:hover:bg-neutral-800 transition-colors">
                    <i class="fa fa-moon-o dark:hidden text-neutral-700"></i>
                    <i class="fa fa-sun-o hidden dark:block text-white-300"></i>
                </button>
                <button id="add-web-btn" class="btn-primary">
                    <i class="fa fa-plus"></i>
                    <span>添加网页</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 搜索和标签筛选区 -->
    <div class="sticky top-[61px] z-40 glass-effect border-b border-neutral-200 dark:border-neutral-800 shadow-sm">
        <div class="container mx-auto px-4 py-3">
            <!-- 搜索框 -->
            <div class="relative mb-3">
                <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 z-20"></i>
                <input 
                    type="text" 
                    id="search-input" 
                    class="search-input-field pl-12 pr-4 py-2.5" 
                    placeholder="搜索网页标题、备注或标签..."
                >
                <button id="clear-search" class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 hidden">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            
            <!-- 标签筛选 -->
            <div class="flex items-center gap-2 overflow-x-auto scrollbar-hide pb-1">
                <!-- 【修复 P3】为“全部”按钮添加 ID/事件绑定，并移除 tag-active 初始类，让 JS 统一管理 -->
                <button id="all-tag-button" class="tag" data-tag="all">全部</button>
                <div id="tags-container" class="flex items-center gap-2">
                    <!-- 标签将通过 JavaScript 动态生成 -->
                </div>
                <button id="manage-tags-btn" class="tag hover:bg-neutral-200 dark:hover:bg-neutral-700 text-neutral-600 dark:text-neutral-400">
                    <i class="fa fa-plus"></i> 管理标签
                </button>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <!-- 【优化 1】为 main 添加 pb-16 留出底部操作栏的空间 -->
    <main class="container mx-auto px-4 py-6 pb-16">
        <!-- 空状态提示 -->
        <div id="empty-state" class="flex flex-col items-center justify-center py-16 animate-fade-in">
            <div class="w-24 h-24 rounded-full bg-primary bg-opacity-10 flex items-center justify-center mb-4">
                <i class="fa fa-folder-open text-primary text-4xl"></i>
            </div>
            <h2 class="text-xl font-semibold mb-2">还没有收藏任何网页</h2>
            <p class="text-neutral-500 dark:text-neutral-400 text-center max-w-md mb-6">点击右上角的 "+" 按钮开始添加你的第一个网页收藏吧！</p>
            <button id="empty-add-btn" class="btn-primary">
                <i class="fa fa-plus"></i>
                <span>添加第一个网页</span>
            </button>
        </div>

        <!-- 收藏列表 -->
        <div id="collection-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden auto-rows-min items-start">
            <!-- 收藏卡片将通过 JavaScript 动态生成 -->
        </div>

        <!-- 搜索无结果状态 -->
        <div id="search-no-result" class="flex flex-col items-center justify-center py-16 animate-fade-in hidden">
            <div class="w-24 h-24 rounded-full bg-neutral-200 dark:bg-neutral-800 flex items-center justify-center mb-4">
                <i class="fa fa-search text-neutral-400 text-4xl"></i>
            </div>
            <h2 class="text-xl font-semibold mb-2">没有找到匹配的网页</h2>
            <p class="text-neutral-500 dark:text-neutral-400 text-center max-w-md mb-6">尝试使用其他关键词或标签进行搜索</p>
            <button id="clear-search-btn" class="btn-secondary">
                <i class="fa fa-times"></i>
                <span>清除搜索</span>
            </button>
        </div>
    </main>
    
    <!-- 【新增】批量操作悬浮栏 -->
    <div id="bulk-edit-bar" class="bulk-edit-bar text-white py-3 px-4">
        <div class="container mx-auto flex items-center justify-between">
            <span id="bulk-selected-count" class="font-semibold">已选 0 项</span>
            <div class="flex items-center gap-3">
                <button id="batch-tag-btn" class="btn-secondary bg-primary-dark text-white text-sm border-white border-opacity-30 hover:bg-opacity-80">
                    <i class="fa fa-tags"></i>
                    <span>批量标签</span>
                </button>
                <button id="batch-delete-btn" class="btn-secondary bg-red-500 text-white text-sm border-red-400 border-opacity-50 hover:bg-red-400">
                    <i class="fa fa-trash"></i>
                    <span>批量删除</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 底部操作栏 -->
    <footer id="main-footer" class="fixed bottom-0 left-0 right-0 glass-effect border-t border-neutral-200 dark:border-neutral-800 py-3 px-4 z-40">
        <div class="container mx-auto flex items-center justify-between">
            <div class="text-sm text-neutral-500 dark:text-neutral-400">
                <span id="item-count">0</span> 个网页收藏
            </div>
            <div class="flex items-center gap-2">
                <button id="export-all-btn" class="btn-secondary text-sm">
                    <i class="fa fa-download"></i>
                    <span>导出全部</span>
                </button>
                <button id="import-btn" class="btn-secondary text-sm">
                    <i class="fa fa-upload"></i>
                    <span>导入</span>
                </button>
            </div>
        </div>
    </footer>

    <!-- 添加网页模态框 -->
    <div id="add-web-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden animate-fade-in">
        <div class="bg-white dark:bg-neutral-800 rounded-2xl shadow-lg w-full max-w-lg mx-4 animate-slide-up overflow-hidden">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold">添加新网页</h2>
                    <button class="close-modal text-neutral-500 hover:text-neutral-700 dark:text-neutral-400 dark:hover:text-neutral-200">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>
                
                <div class="mb-4">
                    <label for="web-title" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">网页标题</label>
                    <input type="text" id="web-title" class="input-field" placeholder="给这个网页起个名字">
                </div>
                
                <div class="mb-4">
                    <label for="web-description" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">备注 (可选)</label>
                    <textarea id="web-description" class="input-field" rows="2" placeholder="添加一些备注信息..."></textarea>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">标签 (可选)</label>
                    <div class="flex flex-wrap gap-2 mb-2" id="add-tags-container">
                        <!-- 选中的标签将在这里显示 -->
                    </div>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="web-tags-input" 
                            class="input-field" 
                            placeholder="输入标签，按回车添加"
                        >
                        <div id="tags-suggestions" class="absolute left-4 right-0 top-full mt-1 bg-white dark:bg-neutral-800 rounded-lg shadow-lg border border-neutral-200 dark:border-neutral-700 max-h-40 overflow-y-auto scrollbar-hide hidden z-10">
                            <!-- 标签建议将通过 JavaScript 动态生成 -->
                        </div>
                    </div>
                    <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-1">多个标签用回车分隔</p>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">上传方式</label>
                    <div class="flex gap-3 mb-3">
                        <button id="upload-file-tab" class="flex-1 py-2 rounded-lg bg-primary text-white">文件上传</button>
                        <button id="paste-code-tab" class="flex-1 py-2 rounded-lg bg-neutral-200 dark:bg-neutral-700">代码粘贴</button>
                    </div>
                    
                    <!-- 文件上传区域 -->
                    <div id="file-upload-area" class="border-2 border-dashed border-neutral-300 dark:border-neutral-600 rounded-lg p-6 text-center cursor-pointer hover:border-primary transition-colors">
                        <input type="file" id="html-file-input" accept=".html" class="hidden">
                        <i class="fa fa-file-text-o text-neutral-400 text-3xl mb-2"></i>
                        <p class="text-sm text-neutral-500 dark:text-neutral-400">点击或拖拽 HTML 文件到这里</p>
                        <p class="text-xs text-neutral-400 dark:text-neutral-500 mt-1">支持 .html 格式文件</p>
                    </div>
                    
                    <!-- 代码粘贴区域 -->
                    <div id="code-paste-area" class="hidden">
                        <textarea id="html-code-input" class="input-field" rows="6" placeholder="粘贴完整的 HTML 代码（包含 &lt;html&gt; 标签）"></textarea>
                    </div>
                </div>
                
                <div class="flex justify-end gap-3">
                    <button class="close-modal btn-secondary">取消</button>
                    <button id="save-web-btn" class="btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑网页模态框 -->
    <div id="edit-web-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden animate-fade-in">
        <div class="bg-white dark:bg-neutral-800 rounded-2xl shadow-lg w-full max-w-lg mx-4 animate-slide-up overflow-hidden">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold">编辑网页</h2>
                    <button class="close-modal text-neutral-500 hover:text-neutral-700 dark:text-neutral-400 dark:hover:text-neutral-200">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>
                
                <input type="hidden" id="edit-web-id">
                
                <div class="mb-4">
                    <label for="edit-web-title" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">网页标题</label>
                    <input type="text" id="edit-web-title" class="input-field" placeholder="给这个网页起个名字">
                </div>
                
                <div class="mb-4">
                    <label for="edit-web-description" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">备注 (可选)</label>
                    <textarea id="edit-web-description" class="input-field" rows="2" placeholder="添加一些备注信息..."></textarea>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">标签 (可选)</label>
                    <div class="flex flex-wrap gap-2 mb-2" id="edit-tags-container">
                        <!-- 选中的标签将在这里显示 -->
                    </div>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="edit-web-tags-input" 
                            class="input-field" 
                            placeholder="输入标签，按回车添加"
                        >
                        <div id="edit-tags-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-white dark:bg-neutral-800 rounded-lg shadow-lg border border-neutral-200 dark:border-neutral-700 max-h-40 overflow-y-auto scrollbar-hide hidden z-10">
                            <!-- 标签建议将通过 JavaScript 动态生成 -->
                        </div>
                    </div>
                    <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-1">多个标签用回车分隔</p>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">HTML 代码</label>
                    
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex gap-3">
                            <button id="view-code-tab" class="py-2 rounded-lg w-28 bg-primary text-white">查看代码</button>
                            <button id="edit-code-tab" class="py-2 rounded-lg w-28 bg-neutral-200 dark:bg-neutral-700">编辑代码</button>
                        </div>
                        
                        <div class="code-controls"> 
                            <button id="copy-code-btn" class="code-control-btn">
                                <i class="fa fa-clone"></i>
                            </button>
                            <button id="fullscreen-code-btn" class="code-control-btn">
                                <i class="fa fa-expand"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 代码查看区域 -->
                    <div id="code-view-area" class="bg-neutral-100 dark:bg-neutral-900 rounded-lg p-4 h-40 overflow-y-auto font-mono text-sm whitespace-pre-wrap">
                        <!-- 代码将通过 JavaScript 动态插入 -->
                    </div>
                    
                    <!-- 代码编辑区域 -->
                    <div id="code-edit-area" class="relative hidden">
                        <textarea id="edit-html-code-input" class="input-field" rows="6" placeholder="编辑 HTML 代码..."></textarea>
                    </div>
                </div>
                
                <div class="flex justify-between gap-3">
                    <div class="flex gap-1">
                        <button id="undo-code-btn" class="code-control-btn" title="撤销 (Ctrl+Z)">
                            <i class="fa fa-undo"></i>
                        </button>
                        <button id="redo-code-btn" class="code-control-btn" title="恢复 (Ctrl+Y)">
                            <i class="fa fa-repeat"></i>
                        </button>
                    </div>
                    <div class="flex gap-3">
                        <button id="delete-web-btn" class="btn-secondary text-red-500">
                            <span>删除</span>
                        </button>
                        <button class="close-modal btn-secondary">取消</button>
                        <button id="update-web-btn" class="btn-primary">更新</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 【新增】全屏代码编辑/查看模态框 -->
    <div id="code-fullscreen-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden animate-fade-in">
        <div class="bg-white dark:bg-neutral-800 rounded-none shadow-lg w-full h-full animate-slide-up overflow-hidden flex flex-col">
            <div class="p-4 border-b border-neutral-200 dark:border-neutral-700 flex items-center justify-between bg-white dark:bg-neutral-800">
                <h2 id="fullscreen-code-title" class="text-lg font-bold text-neutral-900 dark:text-neutral-100"></h2>
                <div class="flex items-center gap-2">
                    <button id="fullscreen-undo-btn" class="code-control-btn" title="撤销 (Ctrl+Z)">
                        <i class="fa fa-undo"></i>
                    </button>
                    <button id="fullscreen-redo-btn" class="code-control-btn" title="恢复 (Ctrl+Y)">
                        <i class="fa fa-repeat"></i>
                    </button>
                    <button id="fullscreen-copy-btn" class="code-control-btn">
                        <i class="fa fa-clone"></i>
                    </button>
                    <button id="close-fullscreen-btn" class="code-control-btn hover:text-red-400 dark:hover:text-red-400">
                        <i class="fa fa-compress"></i>
                    </button>
                </div>
            </div>
            
            <div id="fullscreen-code-content" class="flex-1 relative">
                <div id="fullscreen-code-view" class="w-full h-full p-4 overflow-y-auto font-mono text-sm whitespace-pre-wrap bg-neutral-100 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100">
                    </div>
                <div id="fullscreen-code-edit" class="w-full h-full hidden">
                    <textarea id="fullscreen-html-code-input" class="w-full h-full bg-neutral-100 dark:bg-neutral-900 border-0 p-4 font-mono text-sm text-neutral-900 dark:text-neutral-100 focus:outline-none" placeholder="编辑 HTML 代码..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- 管理标签模态框 -->

    <!-- 提示消息组件 -->
    <div id="toast" class="fixed top-4 right-4 z-50 bg-white dark:bg-neutral-800 shadow-lg rounded-lg px-4 py-3 flex items-center gap-3 transform translate-x-full transition-transform duration-300 opacity-0">
        <div id="toast-icon" class="w-6 h-6 rounded-full flex items-center justify-center">
            <i id="toast-icon-i" class="fa"></i>

        <div id="toast-message" class="text-sm font-medium"></div>

    <script>
        // 【新增】自定义时间格式化函数，用于导入标记
        const formatTimeForImportMark = (isoString) => {
            if (!isoString) return '';
            const date = new Date(isoString);
            // 格式化为 YYYY/MM/DD HH:MM
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            }).replace(/[ ]/g, '/'); // 将空格替换为斜杠，使标记更紧凑
        };
        
        // 标签存储模块
        const TagStorage = {
            // 存储键名
            STORAGE_KEY: 'web_collector_tags',
            
            // 获取所有标签
            getAllTags() {
                const stored = localStorage.getItem(this.STORAGE_KEY);
                return stored ? JSON.parse(stored) : [];
            },
            
            // 添加新标签
            addTag(tagName) {
                // 标准化标签名称（小写，去空格）
                const trimmedName = tagName.trim();
                if (!trimmedName) return null;

                const normalizedName = trimmedName.toLowerCase();
                
                const tags = this.getAllTags();
                
                // 检查标签是否已存在 (忽略大小写)
                if (tags.some(tag => tag.name.toLowerCase() === normalizedName)) {
                    return null; // 标签已存在
                }
                
                const newTag = {
                    id: Date.now().toString(),
                    name: trimmedName, // 保存原始大小写
                    createdAt: new Date().toISOString()
                };
                
                tags.push(newTag);
                // 【优化 A 准备】错误处理
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(tags));
                } catch (e) {
                    UIRenderer.showToast('标签存储失败，可能空间不足或处于隐私模式。', 'error');
                }
                return newTag;
            },
            
            // 删除标签
            deleteTag(tagId) {
                const tags = this.getAllTags();
                const index = tags.findIndex(tag => tag.id === tagId);
                
                if (index !== -1) {
                    const deleted = tags.splice(index, 1);
                    // 【优化 A 准备】错误处理
                    try {
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(tags));
                        
                        // 同时从所有网页中移除该标签
                        const webs = WebStorage.getAllWebs();
                        const deletedTagId = deleted[0].id; // 确保使用删除的标签ID
                        const updatedWebs = webs.map(web => {
                            if (web.tags && web.tags.length) {
                                return {
                                    ...web,
                                    tags: web.tags.filter(id => id !== deletedTagId)
                                };
                            }
                            return web;
                        });
                        
                        localStorage.setItem(WebStorage.STORAGE_KEY, JSON.stringify(updatedWebs));
                    } catch (e) {
                        UIRenderer.showToast('标签/网页存储失败，可能空间不足或处于隐私模式。', 'error');
                        return null; // 阻止返回 deleted[0]
                    }
                    return deleted[0];
                }
                
                return null;
            },
            
            // 通过ID获取标签
            getTagById(tagId) {
                const tags = this.getAllTags();
                return tags.find(tag => tag.id === tagId);
            },
            
            // 通过ID列表获取标签名称列表
            getTagNamesByTagIds(tagIds) {
                if (!tagIds || !tagIds.length) return [];
                
                const tags = this.getAllTags();
                return tagIds.map(tagId => {
                    const tag = tags.find(t => t.id === tagId);
                    return tag ? tag.name : null;
                }).filter(Boolean);
            },
            
            // 从网页集合中提取所有使用的标签ID
            getUsedTagIdsFromWebs(webs) {
                const tagIds = new Set();
                
                webs.forEach(web => {
                    if (web.tags && web.tags.length) {
                        web.tags.forEach(tagId => tagIds.add(tagId));
                    }
                });
                
                return Array.from(tagIds);
            }
        };

        // 数据存储模块
        const WebStorage = {
            // 存储键名
            STORAGE_KEY: 'web_collector_items',
            
            // 获取所有收藏的网页
            getAllWebs() {
                const stored = localStorage.getItem(this.STORAGE_KEY);
                return stored ? JSON.parse(stored) : [];
            },
            
            // 获取单个网页
            getWebById(id) {
                const webs = this.getAllWebs();
                return webs.find(web => web.id === id);
            },
            
            // 添加新网页
            addWeb(web) {
                const webs = this.getAllWebs();
                const newWeb = {
                    id: Date.now().toString(),
                    title: web.title,
                    description: web.description,
                    htmlContent: web.htmlContent,
                    tags: web.tags || [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                webs.push(newWeb);
                // 【优化 A 准备】错误处理
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(webs));
                } catch (e) {
                    UIRenderer.showToast('网页存储失败，可能空间不足或处于隐私模式。', 'error');
                }
                return newWeb;
            },
            
            // 更新网页
            updateWeb(id, updatedWeb) {
                const webs = this.getAllWebs();
                const index = webs.findIndex(web => web.id === id);
                if (index !== -1) {
                    webs[index] = {
                        ...webs[index],
                        ...updatedWeb,
                        updatedAt: new Date().toISOString()
                    };
                    // 【优化 A 准备】错误处理
                    try {
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(webs));
                    } catch (e) {
                        UIRenderer.showToast('网页更新失败，可能空间不足或处于隐私模式。', 'error');
                        return null;
                    }
                    return webs[index];
                }
                return null;
            },
            
            // 删除网页
            deleteWeb(id) {
                const webs = this.getAllWebs();
                const index = webs.findIndex(web => web.id === id);
                if (index !== -1) {
                    const deleted = webs.splice(index, 1);
                    // 【优化 A 准备】错误处理
                    try {
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(webs));
                    } catch (e) {
                        UIRenderer.showToast('网页删除失败，可能空间不足或处于隐私模式。', 'error');
                        return null;
                    }
                    return deleted[0];
                }
                return null;
            },
            
            // 批量删除多个网页
            batchDeleteWebs(ids) {
                const webs = this.getAllWebs();
                const initialLength = webs.length;
                
                const updatedWebs = webs.filter(web => !ids.includes(web.id));
                const deletedCount = initialLength - updatedWebs.length;

                if (deletedCount > 0) {
                    try {
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(updatedWebs));
                        return deletedCount;
                    } catch (e) {
                        UIRenderer.showToast('批量删除后存储失败，可能空间不足。', 'error');
                        return 0;
                    }
                }
                return 0;
            },
            
            // 【新增】批量更新标签的核心逻辑
            batchUpdateTags(idsToUpdate, tagsToAdd, tagsToRemove) {
                const webs = this.getAllWebs();
                let tagsModifiedCount = 0;

                const updatedWebs = webs.map(web => {
                    if (idsToUpdate.includes(web.id)) {
                        let currentTags = new Set(web.tags);
                        let modified = false;
                        
                        // 1. 批量添加逻辑
                        tagsToAdd.forEach(tagId => {
                            if (!currentTags.has(tagId)) {
                                currentTags.add(tagId);
                                modified = true;
                            }
                        });
                        
                        // 2. 批量移除逻辑
                        tagsToRemove.forEach(tagId => {
                            if (currentTags.has(tagId)) {
                                currentTags.delete(tagId);
                                modified = true;
                            }
                        });
                        
                        if (modified) {
                            tagsModifiedCount++;
                            return {
                                ...web,
                                tags: Array.from(currentTags),
                                updatedAt: new Date().toISOString()
                            };
                        }
                    }
                    return web; // 非选中或未修改的网页保持不变
                });

                if (tagsModifiedCount > 0) {
                    try {
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(updatedWebs));
                        return tagsModifiedCount;
                    } catch (e) {
                        UIRenderer.showToast('批量标签操作后存储失败，可能空间不足。', 'error');
                        return 0;
                    }
                }
                return 0;
            },


            // 导出所有网页
            exportAllWebs() {
                const webs = this.getAllWebs();
                const tags = TagStorage.getAllTags();
                const backupData = {
                    type: 'web_collector_backup',
                    version: '2.0',
                    createdAt: new Date().toISOString(),
                    items: webs,
                    tags: tags
                };
                return JSON.stringify(backupData, null, 2);
            },
            
            // 导入网页
            importWebs(backupData) {
                try {
                    const data = typeof backupData === 'string' ? JSON.parse(backupData) : backupData;
                    
                    // 验证备份数据格式
                    if (data.type !== 'web_collector_backup' || !Array.isArray(data.items)) {
                        throw new Error('无效的备份数据格式');
                    }
                    
                    // 导入标签（如果有）
                    if (Array.isArray(data.tags)) {
                        const existingTags = TagStorage.getAllTags().map(t => t.name.toLowerCase());
                        let tagsImportedCount = 0;
                        data.tags.forEach(tag => {
                            // 尝试以原始名称添加，如果名称不存在则添加
                            if (!existingTags.includes(tag.name.toLowerCase())) {
                                TagStorage.addTag(tag.name);
                                tagsImportedCount++;
                            }
                        });
                    }
                    
                    // 保存现有数据
                    const existingWebs = this.getAllWebs();

                    
                    // 添加新数据（避免ID冲突）
                    let newWebsCount = 0;
                    const newWebs = data.items.map(web => {
                        // 检查 ID 是否已存在
                        const idExists = existingWebs.some(existing => existing.id === web.id);
                        
                        // 【优化 3】确定新标题：如果ID冲突，则添加 "备份" 标记和备份时的更新时间
                        const backupTimeSuffix = formatTimeForImportMark(web.updatedAt); // <-- 获取备份时间戳
                        const newTitle = idExists
                            ? `${web.title} (备份: ${backupTimeSuffix})` // <-- 使用备份时间戳
                            : web.title;
                        
                        // 处理标签映射（如果标签ID不存在，尝试通过名称匹配）
                        let mappedTags = [];
                        if (web.tags && web.tags.length) {
                            const allTags = TagStorage.getAllTags();
                            mappedTags = web.tags.map(tagId => {
                                // 查找相同ID的标签
                                let tag = allTags.find(t => t.id === tagId);
                                
                                // 如果没找到，尝试通过名称查找
                                if (!tag && data.tags) {
                                    const originalTag = data.tags.find(t => t.id === tagId);
                                    if (originalTag) {
                                        // 匹配标签名称（不区分大小写）
                                        tag = allTags.find(t => t.name.toLowerCase() === originalTag.name.toLowerCase());
                                    }
                                }
                                
                                return tag ? tag.id : null;
                            }).filter(Boolean);
                        }
                        
                        // 检查网页是否重复（通过标题和内容简单判断）
                        // 注意：这里需要使用原始标题进行去重，避免标记影响判断
                        const isDuplicate = existingWebs.some(existing => 
                            existing.title === web.title && existing.htmlContent === web.htmlContent
                        );

                        if (isDuplicate) {
                            return null; // 跳过重复项
                        }
                        
                        newWebsCount++;
                        return {
                            ...web,
                            title: newTitle, // 使用新生成的标题
                            id: idExists ? Date.now().toString() + Math.random().toString(36).substr(2, 9) : web.id,
                            tags: mappedTags,
                            importedAt: new Date().toISOString()
                        };
                    }).filter(Boolean); // 移除跳过的重复项
                    
                    // 合并并保存
                    const mergedWebs = [...existingWebs, ...newWebs];
                    // 【优化 A 准备】错误处理
                    try {
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(mergedWebs));
                    } catch (e) {
                        UIRenderer.showToast('导入后存储数据失败，可能空间不足或处于隐私模式。', 'error');
                    }
                    
                    return newWebsCount;
                } catch (error) {
                    console.error('导入失败:', error);
                    throw error;
                }
            },
            
            // 根据搜索词和标签筛选网页
            filterWebs(searchTerm, tagId) {
                const webs = this.getAllWebs();
                let filtered = [...webs];
                
                // 应用标签筛选
                if (tagId && tagId !== 'all') {
                    filtered = filtered.filter(web => web.tags && web.tags.includes(tagId));
                }
                
                // 应用搜索筛选
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    filtered = filtered.filter(web => {
                        // 搜索标题
                        if (web.title.toLowerCase().includes(term)) return true;
                        
                        // 搜索描述
                        if (web.description && web.description.toLowerCase().includes(term)) return true;
                        
                        // 搜索标签
                        const tagNames = TagStorage.getTagNamesByTagIds(web.tags);
                        return tagNames.some(name => name.toLowerCase().includes(term));
                    });
                }
                
                return filtered;
            }
        };

        // UI 渲染模块
        const UIRenderer = {
            // 渲染收藏列表
            renderCollectionList(searchTerm = '', activeTagId = 'all') {
                const filteredWebs = WebStorage.filterWebs(searchTerm, activeTagId);
                const collectionList = document.getElementById('collection-list');
                const emptyState = document.getElementById('empty-state');
                const searchNoResult = document.getElementById('search-no-result');
                const itemCount = document.getElementById('item-count');
                const mainFooter = document.getElementById('main-footer');
                const bulkEditBar = document.getElementById('bulk-edit-bar');
                
                // 获取所有网页总数
                const totalWebs = WebStorage.getAllWebs().length;
                itemCount.textContent = totalWebs;

                // 【BUG 1 修复】更新底部栏显示状态
                const isBulkMode = UIManager.state.isBulkEditMode;
                if (isBulkMode) {
                    mainFooter.classList.add('hidden');
                    bulkEditBar.classList.remove('hidden');
                } else {
                    mainFooter.classList.remove('hidden');
                    bulkEditBar.classList.add('hidden');
                }
                
                // 显示/隐藏空状态或无结果状态
                if (totalWebs === 0) {
                    collectionList.classList.add('hidden');
                    searchNoResult.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }
                
                if (filteredWebs.length === 0) {
                    collectionList.classList.add('hidden');
                    emptyState.classList.add('hidden');
                    searchNoResult.classList.remove('hidden');
                    return;

            // 渲染标签建议 (代码不变)
            renderTagSuggestions(inputId, suggestionsContainerId, currentTags = []) {
                const input = document.getElementById(inputId);
                const suggestionsContainer = document.getElementById(suggestionsContainerId);
                const searchTerm = input.value.toLowerCase().trim();
                
                // 如果没有输入内容，隐藏建议
                if (!searchTerm) {
                    suggestionsContainer.classList.add('hidden');
                    return;
                }
                
                // 获取所有标签并过滤
                let allTags = TagStorage.getAllTags();
                
                // 排除已选中的标签
                if (currentTags && currentTags.length) {
                    allTags = allTags.filter(tag => !currentTags.includes(tag.id));
                }
                
                // 根据搜索词过滤
                const filteredTags = allTags.filter(tag => 
                    tag.name.toLowerCase().includes(searchTerm)
                );
                
                // 如果没有匹配的标签，隐藏建议
                if (filteredTags.length === 0) {
                    suggestionsContainer.classList.add('hidden');
                    return;
                }
                
                // 清空并渲染建议
                suggestionsContainer.innerHTML = '';
                filteredTags.forEach(tag => {
                    const suggestion = document.createElement('div');
                    suggestion.className = 'px-3 py-2 hover:bg-neutral-100 dark:hover:bg-neutral-700 cursor-pointer text-sm';
                    suggestion.textContent = tag.name;
                    suggestion.dataset.tagId = tag.id;
                    
                    suggestion.addEventListener('click', () => {
                        // 触发添加标签事件
                        if (inputId === 'web-tags-input') {
                            UIManager.addTagToWeb(tag.id);
                        } else if (inputId === 'edit-web-tags-input') {
                            UIManager.addTagToEditWeb(tag.id);
                        } else if (inputId === 'batch-add-tags-input') {
                            UIManager.addTagToBatch(tag.id); // 新增的批量添加标签函数
                        }
                        
                        // 清空输入并隐藏建议
                        input.value = '';
                        suggestionsContainer.classList.add('hidden');
                    });
                    
                    suggestionsContainer.appendChild(suggestion);
                });
                
                // 显示建议
                suggestionsContainer.classList.remove('hidden');
            },

            // 【新增】渲染批量添加的标签
            renderBatchAddTags(selectedTagIds = []) {
                const container = document.getElementById('batch-add-tags-container');

                const suggestionsContainer = document.getElementById('batch-add-tags-suggestions');
                container.innerHTML = '';
                
                selectedTagIds.forEach(tagId => {
                    const tag = TagStorage.getTagById(tagId);
                    if (!tag) return;
                    
                    const tagElement = document.createElement('div');
                    tagElement.className = 'tag flex items-center gap-1 bg-primary bg-opacity-10 text-primary dark:bg-primary dark:bg-opacity-20 dark:text-primary';
                    tagElement.innerHTML = `

                            <i class="fa fa-times"></i>

                    container.appendChild(tagElement);

                    tagElement.querySelector('.remove-batch-tag-btn').addEventListener('click', () => {

                // 确保建议功能可用
                input.addEventListener('input', () => {
                    UIRenderer.renderTagSuggestions('batch-add-tags-input', 'batch-add-tags-suggestions', UIManager.state.batchTagsToAdd);
                });

                // 添加回车事件处理
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const tagName = input.value.trim();
                        if (tagName) {
                        // 尝试添加新标签
                        const newTag = TagStorage.addTag(tagName);
                        if (newTag) {
                            // 新建成功
                        UIManager.addTagToBatch(newTag.id);
                        UIRenderer.showToast(`已创建并添加标签: ${newTag.name}`);
                        } else {
                            // 标签已存在，尝试查找并添加
                            const tags = TagStorage.getAllTags();
                            const existingTag = tags.find(t => t.name.toLowerCase() === tagName.toLowerCase());
                            if (existingTag && !UIManager.state.batchTagsToAdd.includes(existingTag.id)) {
                                UIManager.addTagToBatch(existingTag.id);
                                UIRenderer.showToast(`已添加现有标签: ${existingTag.name}`, 'info');

            // 统一刷新所有主界面UI
            refreshAllUI() {
                UIRenderer.renderCollectionList(this.state.searchTerm, this.state.activeTagId);
                UIRenderer.renderTagFilters(this.state.activeTagId);
            },

            // 初始化主题
            initTheme() {
                const isDarkMode = localStorage.getItem('dark_mode') === 'true' || 
                                  (localStorage.getItem('dark_mode') === null && 
                                   window.matchMedia('(prefers-color-scheme: dark)').matches);
                
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            },
            
            // 切换主题
            toggleTheme() {
                const isDarkMode = document.documentElement.classList.toggle('dark');
                localStorage.setItem('dark_mode', isDarkMode);
            },
            
            // 【功能 1 - 逻辑】切换批量编辑模式 (修复 BUG 3)
            toggleBulkEditMode() {
                // 【修复 2】检查空状态
                const totalWebs = WebStorage.getAllWebs().length;
                if (totalWebs === 0) {
                    UIRenderer.showToast('没有网页可供选择，请先添加网页。', 'info');
                    return; // 阻止进入批量模式
                }
                
                this.state.isBulkEditMode = !this.state.isBulkEditMode;
                this.state.selectedWebIds = []; // 清空选中项
                this.refreshAllUI();
            },

            // 【功能 1 - 逻辑】切换网页选中状态
            toggleSelectWeb(id) {
                const index = this.state.selectedWebIds.indexOf(id);
                if (index > -1) {
                    this.state.selectedWebIds.splice(index, 1); // 移除
                } else {
                    this.state.selectedWebIds.push(id); // 添加
                }
                this.refreshAllUI(); // 刷新 UI，更新高亮和批量操作栏
            },
            
            // 【新增】退出批量编辑模式的辅助函数

            exitBulkEditMode() {

                this.state.isBulkEditMode = false;

                this.state.selectedWebIds = [];

                // 确保UI完全更新，包括按钮样式

                this.refreshAllUI();

                // 强制更新批量编辑按钮的图标状态

                const toggleBulkEditBtn = document.getElementById('toggle-bulk-edit-btn');

                if (toggleBulkEditBtn) {

                    const bulkEditBtnIcon = toggleBulkEditBtn.querySelector('i');

                    if (bulkEditBtnIcon) {

                        // 非批量模式: 多选列表图标

                        bulkEditBtnIcon.className = 'fa fa-list-ul text-neutral-700 dark:text-neutral-300';

                    }

                }

            },
            
            // 【功能 1 - 增强】批量删除逻辑

            batchDelete() {

                const ids = this.state.selectedWebIds;

                if (ids.length === 0) return;



                if (!confirm(`确定要删除选中的 ${ids.length} 个网页吗？此操作不可撤销。`)) {

                    return;

                }

                

                const deletedCount = WebStorage.batchDeleteWebs(ids);

                

                // 检查删除后是否还有剩余网页

                const remainingWebs = WebStorage.getAllWebs().length;

                if (remainingWebs === 0) {

                    // 如果删除后没有剩余网页，退出批量模式

                    this.exitBulkEditMode();

                } else {

                    // 如果还有剩余网页，清空已选中的网页，但保持批量模式

                    this.state.selectedWebIds = [];

                    this.refreshAllUI();

                }

                

                if (deletedCount > 0) {

                    UIRenderer.showToast(`成功删除 ${deletedCount} 个网页`, 'success');

                } else {

                    UIRenderer.showToast('没有网页被删除。', 'info');

                }

            },
            
            // 【新增】打开批量标签模态框
            openBatchTagModal() {
                const ids = this.state.selectedWebIds;
                if (ids.length === 0) {
                    UIRenderer.showToast('请至少选择一个网页进行操作', 'info');
                    return;
                }

                // 1. 重置临时状态
                this.state.batchTagsToAdd = [];
                this.state.batchTagsToExclude = [];

                // 2. 计算共同标签 (用于移除区域)
                const webs = ids.map(id => WebStorage.getWebById(id));
                let commonTags = new Set(webs[0].tags); // 从第一个网页的标签开始
                
                for (let i = 1; i < webs.length; i++) {
                    const currentTags = new Set(webs[i].tags);
                    commonTags = new Set([...commonTags].filter(tag => currentTags.has(tag)));
                }

                // 3. 渲染模态框
                document.getElementById('batch-count-display').textContent = ids.length;
                UIRenderer.renderBatchAddTags(this.state.batchTagsToAdd);
                UIRenderer.renderBatchRemoveTags(Array.from(commonTags));
                
                // 4. 显示模态框
                document.getElementById('batch-tag-modal').classList.remove('hidden');
            },

            // 【新增】批量添加标签到临时列表
            addTagToBatch(tagId) {
                if (!this.state.batchTagsToAdd.includes(tagId)) {
                    this.state.batchTagsToAdd.push(tagId);
                    UIRenderer.renderBatchAddTags(this.state.batchTagsToAdd);
                }
            },

            // 【新增】从临时列表移除标签
            removeTagFromBatch(tagId) {
                this.state.batchTagsToAdd = this.state.batchTagsToAdd.filter(id => id !== tagId);
                UIRenderer.renderBatchAddTags(this.state.batchTagsToAdd);
            },
            
            // 【新增】切换标签的批量移除状态
            toggleTagForBatchRemoval(tagId) {
            const index = this.state.batchTagsToExclude.indexOf(tagId);
            if (index > -1) {
                this.state.batchTagsToExclude.splice(index, 1); // 移除
            } else {
                this.state.batchTagsToExclude.push(tagId); // 添加
            }
            // 重新渲染移除区域以更新高亮
            const container = document.getElementById('batch-remove-tags-container');
            if (container) {
                // 获取当前的共同标签（从现有标签元素中提取）
                const currentTags = Array.from(container.querySelectorAll('.tag[data-id]')).map(tag => tag.dataset.id);
                UIRenderer.renderBatchRemoveTags(currentTags);
                }
            },

            // 【新增】确认应用批量标签操作
             processBatchTags() {
                const ids = this.state.selectedWebIds;
                const tagsToAdd = this.state.batchTagsToAdd;
                const tagsToRemove = this.state.batchTagsToExclude;
                const count = ids.length;

                if (tagsToAdd.length === 0 && tagsToRemove.length === 0) {
                    UIRenderer.showToast('没有选择任何添加或移除的标签', 'info');
                    return;
                }
    
                // 构造确认消息
                let message = `确认对选中的 ${count} 个网页进行标签操作吗？\n`;
                if (tagsToAdd.length > 0) {
                    message += `\n - 批量添加 ${tagsToAdd.length} 个标签`;
                }
                if (tagsToRemove.length > 0) {
                    message += `\n - 批量移除 ${tagsToRemove.length} 个标签`;
                }

                if (!confirm(message)) {
                    return; // 用户取消
                }

                const modifiedCount = WebStorage.batchUpdateTags(ids, tagsToAdd, tagsToRemove);
    
                this.closeAllModals();
                this.state.isBulkEditMode = false; // 退出批量模式
                this.state.selectedWebIds = [];
                this.refreshAllUI();

                if (modifiedCount > 0) {
                    UIRenderer.showToast(`成功修改了 ${modifiedCount} 个网页的标签`, 'success');
                } else {
                    UIRenderer.showToast('没有网页的标签被修改。', 'info');
                }
            },
            
            // 【修正】一键复制代码 (修复 BUG 2：实现可靠复制，并支持全屏模态框)
            copyCode(source = 'edit-modal') {
                let codeToCopy = '';

                if (source === 'edit-modal') {
                    const codeEditAreaContainer = document.getElementById('code-edit-area'); // 编辑区域的容器
                    const codeEditInput = document.getElementById('edit-html-code-input');
                    const codeViewArea = document.getElementById('code-view-area');

                    // 判断当前是编辑区域还是查看区域
                    if (!codeEditAreaContainer.classList.contains('hidden')) { 
                        // 编辑区域
                        codeToCopy = codeEditInput.value;
                    } else {
                        // 查看区域
                        codeToCopy = codeViewArea.textContent;
                    }
                } else if (source === 'fullscreen-modal') {
                    const fullEditArea = document.getElementById('fullscreen-code-edit');
                    const fullEditInput = document.getElementById('fullscreen-html-code-input');
                    const fullViewArea = document.getElementById('fullscreen-code-view');
                
                    // 判断全屏模式下是编辑还是查看
                    if (!fullEditArea.classList.contains('hidden')) {
                        codeToCopy = fullEditInput.value;
                    } else {
                        codeToCopy = fullViewArea.textContent;
                    }
                }

                if (!codeToCopy) {
                    UIRenderer.showToast('代码区域为空', 'error');
                    return;
                }

                // 尝试使用 Clipboard API
                navigator.clipboard.writeText(codeToCopy).then(() => {
                    UIRenderer.showToast('代码已复制到剪贴板！', 'success');
                }).catch(err => {
                    console.error('Clipboard API 复制失败:', err);
                    // 兼容性回退
                    this._fallbackCopyTextToClipboard(codeToCopy);
                });
            },
            
            // 【新增】全屏打开代码
            openFullscreenCode() {
                const webId = document.getElementById('edit-web-id').value;
                const web = WebStorage.getWebById(webId);
                if (!web) return;

                const isViewing = !document.getElementById('code-view-area').classList.contains('hidden');
                
                // 1. 设置全屏模态框标题
                document.getElementById('fullscreen-code-title').textContent = `${web.title} - 代码 (${isViewing ? '查看' : '编辑'})`;

                // 2. 同步数据和模式
                const fullView = document.getElementById('fullscreen-code-view');
                const fullEditArea = document.getElementById('fullscreen-code-edit');
                const fullEditInput = document.getElementById('fullscreen-html-code-input');
                const currentEditInput = document.getElementById('edit-html-code-input');
                const currentViewArea = document.getElementById('code-view-area');

                if (isViewing) {
                    // 查看模式
                    fullView.textContent = currentViewArea.textContent;
                    fullView.classList.remove('hidden');
                    fullEditArea.classList.add('hidden');
                } else {
                    // 编辑模式
                    fullEditInput.value = currentEditInput.value;
                    fullView.classList.add('hidden');
                    fullEditArea.classList.remove('hidden');
                }

                // 3. 显示全屏模态框
                document.getElementById('code-fullscreen-modal').classList.remove('hidden');
            },

            // 【新增】关闭全屏代码
            closeFullscreenCode() {
                const fullEditInput = document.getElementById('fullscreen-html-code-input');
                const currentEditInput = document.getElementById('edit-html-code-input');
                const fullEditArea = document.getElementById('fullscreen-code-edit');
                
                // 如果当前处于全屏编辑模式，则同步数据回主编辑框
                if (!fullEditArea.classList.contains('hidden')) {
                    currentEditInput.value = fullEditInput.value;
                    // 同时更新非编辑状态下的查看区域内容
                    document.getElementById('code-view-area').textContent = fullEditInput.value;
                }
                
                document.getElementById('code-fullscreen-modal').classList.add('hidden');
            },
