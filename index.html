                    const editWebTagsInput = document.getElementById('edit-web-tags-input');
                    
                    if (editTagsSuggestions && editWebTagsInput && !editTagsSuggestions.contains(e.target) && e.target !== editWebTagsInput) {
                        editTagsSuggestions.classList.add('hidden');
                    }
                });
                
                // 搜索框事件
                const searchInput = document.getElementById('search-input');
                searchInput.addEventListener('input', () => {
                    this.state.searchTerm = searchInput.value.trim();
                    this.updateSearchUI();
                    
                    // 显示/隐藏清除按钮
                    const clearSearchBtn = document.getElementById('clear-search');
                    if (this.state.searchTerm) {
                        clearSearchBtn.classList.remove('hidden');
                    } else {
                        clearSearchBtn.classList.add('hidden');
                    }
                });
                
                // 清除搜索按钮
                document.getElementById('clear-search').addEventListener('click', () => {
                    this.clearSearch();
                });
                
                document.getElementById('clear-search-btn').addEventListener('click', () => {
                    this.clearSearch();
                });
                
                // 点击模态框背景关闭模态框
                document.querySelectorAll('#add-web-modal, #edit-web-modal, #preview-web-modal, #import-modal, #manage-tags-modal, #batch-tag-modal').forEach(modal => {
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal || e.target.closest('.close-modal')) {
                            this.closeAllModals();
                            // 【全屏功能】关闭全屏代码模态框
                            if (modal.id === 'code-fullscreen-modal') {
                                this.closeFullscreenCode();
                            }
                        }
                    });
                });
            },
            
            // 打开添加网页模态框
            openAddModal() {
                // 重置状态和表单
                this.state.addWebTags = [];
                document.getElementById('web-title').value = '';
                document.getElementById('web-description').value = '';
                document.getElementById('html-file-input').value = '';
                document.getElementById('html-code-input').value = '';
                document.getElementById('web-tags-input').value = '';
                UIRenderer.renderAddWebTags();
                
                // 切换到文件上传标签
                this.switchUploadTab('file');
                
                // 显示模态框
                document.getElementById('add-web-modal').classList.remove('hidden');
            },
            
            // 打开编辑网页模态框
            openEditModal(id) {
                const web = WebStorage.getWebById(id);
                if (!web) return;
                
                // 重置状态
                this.state.editWebTags = web.tags || [];
                this.state.currentFullscreenWebId = id;
                
                // 填充表单
                document.getElementById('edit-web-id').value = web.id;
                document.getElementById('edit-web-title').value = web.title;
                document.getElementById('edit-web-description').value = web.description || '';
                document.getElementById('code-view-area').textContent = web.htmlContent;
                document.getElementById('edit-html-code-input').value = web.htmlContent;
                document.getElementById('edit-web-tags-input').value = ''; // 清空输入框
                
                // 渲染标签
                UIRenderer.renderEditWebTags(this.state.editWebTags);
                
                // 切换到代码查看标签
                this.switchCodeTab('view');
                
                // 显示模态框
                document.getElementById('edit-web-modal').classList.remove('hidden');
            },
            
            // 打开预览网页模态框
            previewWeb(id) {
                const web = WebStorage.getWebById(id);
                if (!web) return;
                
                // 设置标题
                document.getElementById('preview-web-title').textContent = web.title;
                
                // 设置iframe内容
                const iframe = document.getElementById('web-preview-iframe');
                iframe.srcdoc = web.htmlContent;
                
                // 显示模态框
                document.getElementById('preview-web-modal').classList.remove('hidden');
            },
            
            // 打开导入模态框
            openImportModal() {
                // 重置表单
                document.getElementById('backup-file-input').value = '';
                document.getElementById('backup-code-input').value = '';
                
                // 切换到文件导入标签
                this.switchImportTab('file');
                
                // 显示模态框
                document.getElementById('import-modal').classList.remove('hidden');
            },
            
            // 打开管理标签模态框
            openManageTagsModal() {
                // 每次打开时强制渲染所有标签，确保是最新的
                UIRenderer.renderAllTags();
                
                // 清空输入框
                document.getElementById('new-tag-input').value = '';
                
                // 显示模态框
                document.getElementById('manage-tags-modal').classList.remove('hidden');
            },
            
            // 关闭所有模态框
            closeAllModals() {
                document.getElementById('add-web-modal').classList.add('hidden');
                document.getElementById('edit-web-modal').classList.add('hidden');
                document.getElementById('preview-web-modal').classList.add('hidden');
                document.getElementById('import-modal').classList.add('hidden');
                document.getElementById('manage-tags-modal').classList.add('hidden');
                document.getElementById('batch-tag-modal').classList.add('hidden'); // 新增关闭批量标签模态框
                document.getElementById('tags-suggestions').classList.add('hidden');
                document.getElementById('edit-tags-suggestions').classList.add('hidden');
            },
            
            // 切换上传方式标签
            switchUploadTab(tab) {
                const fileTab = document.getElementById('upload-file-tab');
                const codeTab = document.getElementById('paste-code-tab');
                const fileArea = document.getElementById('file-upload-area');
                const codeArea = document.getElementById('code-paste-area');
                
                if (tab === 'file') {
                    fileTab.classList.remove('bg-neutral-200', 'dark:bg-neutral-700');
                    fileTab.classList.add('bg-primary', 'text-white');
                    codeTab.classList.remove('bg-primary', 'text-white');
                    codeTab.classList.add('bg-neutral-200', 'dark:bg-neutral-700');
                    fileArea.classList.remove('hidden');
                    codeArea.classList.add('hidden');
                } else {
                    codeTab.classList.remove('bg-neutral-200', 'dark:bg-neutral-700');
                    codeTab.classList.add('bg-primary', 'text-white');
                    fileTab.classList.remove('bg-primary', 'text-white');
                    fileTab.classList.add('bg-neutral-200', 'dark:bg-neutral-700');
                    codeArea.classList.remove('hidden');
                    fileArea.classList.add('hidden');
                }
            },
            
            // 切换代码查看/编辑标签
            switchCodeTab(tab) {
                const viewTab = document.getElementById('view-code-tab');
                const editTab = document.getElementById('edit-code-tab');
                const viewArea = document.getElementById('code-view-area');
                const editArea = document.getElementById('code-edit-area');
                
                if (tab === 'view') {
                    viewTab.classList.remove('bg-neutral-200', 'dark:bg-neutral-700');
                    viewTab.classList.add('bg-primary', 'text-white');
                    editTab.classList.remove('bg-primary', 'text-white');
                    editTab.classList.add('bg-neutral-200', 'dark:bg-neutral-700');
                    viewArea.classList.remove('hidden');
                    editArea.classList.add('hidden');
                } else {
                    editTab.classList.remove('bg-neutral-200', 'dark:bg-neutral-700');
                    editTab.classList.add('bg-primary', 'text-white');
                    viewTab.classList.remove('bg-primary', 'text-white');
                    viewTab.classList.add('bg-neutral-200', 'dark:bg-neutral-700');
                    editArea.classList.remove('hidden');
                    viewArea.classList.add('hidden');
                }
            },
            
            // 切换导入方式标签
            switchImportTab(tab) {
                const fileTab = document.getElementById('import-file-tab');
                const codeTab = document.getElementById('import-code-tab');
                const fileArea = document.getElementById('file-import-area');
                const codeArea = document.getElementById('code-import-area');
                
                if (tab === 'file') {
                    fileTab.classList.remove('bg-neutral-200', 'dark:bg-neutral-700');
                    fileTab.classList.add('bg-primary', 'text-white');
                    codeTab.classList.remove('bg-primary', 'text-white');
                    codeTab.classList.add('bg-neutral-200', 'dark:bg-neutral-700');
                    fileArea.classList.remove('hidden');
                    codeArea.classList.add('hidden');
                } else {
                    codeTab.classList.remove('bg-neutral-200', 'dark:bg-neutral-700');
                    codeTab.classList.add('bg-primary', 'text-white');
                    fileTab.classList.remove('bg-primary', 'text-white');
                    fileTab.classList.add('bg-neutral-200', 'dark:bg-neutral-700');
                    codeArea.classList.remove('hidden');
                    fileArea.classList.add('hidden');
                }
            },
            
            // 处理HTML文件选择
            handleHtmlFileSelect(file) {
                if (!file || !file.name.endsWith('.html')) {
                    UIRenderer.showToast('请选择HTML文件', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('html-code-input').value = e.target.result;
                    // 在文件上传成功后给出提示
                    UIRenderer.showToast(`文件加载成功: ${file.name}`, 'success');
                };
                reader.readAsText(file);
            },
            
            // 处理备份文件选择
            handleBackupFileSelect(file) {
                if (!file || !file.name.endsWith('.json')) {
                    UIRenderer.showToast('请选择JSON备份文件', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('backup-code-input').value = e.target.result;
                    // 在文件加载成功后给出提示
                    UIRenderer.showToast(`备份文件加载成功: ${file.name}`, 'success');
                };
                reader.readAsText(file);
            },
            
            // 保存新网页
            saveWeb() {
                const title = document.getElementById('web-title').value.trim();
                const description = document.getElementById('web-description').value.trim();
                let htmlContent = document.getElementById('html-code-input').value.trim(); // 统一从代码输入框获取
                
                // 验证
                if (!title) {
                    UIRenderer.showToast('请输入网页标题', 'error');
                    return;
                }
                
                if (!htmlContent) {
                    UIRenderer.showToast('请上传HTML文件或输入HTML代码', 'error');
                    return;
                }
                
                // 创建新网页
                const newWeb = {
                    title,
                    description,
                    htmlContent,
                    tags: this.state.addWebTags
                };
                
                WebStorage.addWeb(newWeb);
                
                // 关闭模态框并刷新UI
                this.closeAllModals();
                this.refreshAllUI();
                UIRenderer.showToast('网页添加成功');
                
                // 重置文件输入
                document.getElementById('html-file-input').value = '';
            },
            
            // 更新网页
            updateWeb() {
                const id = document.getElementById('edit-web-id').value;
                const title = document.getElementById('edit-web-title').value.trim();
                const description = document.getElementById('edit-web-description').value.trim();
                const htmlContent = document.getElementById('edit-html-code-input').value.trim();
                
                // 验证
                if (!title) {
                    UIRenderer.showToast('请输入网页标题', 'error');
                    return;
                }
                
                if (!htmlContent) {
                    UIRenderer.showToast('HTML代码不能为空', 'error');
                    return;
                }
                
                // 更新网页
                const updatedWeb = {
                    title,
                    description,
                    htmlContent,
                    tags: this.state.editWebTags
                };
                
                WebStorage.updateWeb(id, updatedWeb);
                
                // 关闭模态框并刷新UI
                this.closeAllModals();
                this.refreshAllUI();
                UIRenderer.showToast('网页更新成功');
            },
            
            // 删除网页
            deleteWeb(id) {

                if (!confirm('确定要删除这个网页吗？此操作不可撤销。')) {

                    return;

                }

                

                const deleted = WebStorage.deleteWeb(id);

                if (deleted) {

                    // 检查删除后是否还有剩余网页，如果在批量模式下删除了最后一个网页，则退出批量模式

                    const remainingWebs = WebStorage.getAllWebs().length;

                    if (remainingWebs === 0 && this.state.isBulkEditMode) {

                        this.exitBulkEditMode();

                    } else {

                        // 关闭模态框并刷新UI

                        this.closeAllModals();

                        this.refreshAllUI();

                    }

                    UIRenderer.showToast('网页已删除');

                }

            },
            
            // 导出所有网页
            exportAllWebs() {
                const data = WebStorage.exportAllWebs();
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `web-collector-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                UIRenderer.showToast('导出成功');
            },
            
            // 导入网页
            importWebs() {
                let backupData = document.getElementById('backup-code-input').value.trim(); // 统一从代码输入框获取
                
                if (!backupData) {
                    UIRenderer.showToast('请上传备份文件或输入备份代码', 'error');
                    return;
                }
                
                try {
                    const count = WebStorage.importWebs(backupData);
                    this.closeAllModals();
                    this.refreshAllUI();
                    UIRenderer.showToast(`成功导入 ${count} 个网页`);
                } catch (error) {
                    UIRenderer.showToast('导入失败：' + error.message, 'error');
                }
            },
            
            // 打开网页
            openWeb(id) {
                const web = WebStorage.getWebById(id);
                if (!web) return;
                
                // 创建Blob并在新标签页打开
                const blob = new Blob([web.htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            },
            
            // 添加新标签
            addNewTag(tagName) {
                if (!tagName.trim()) {
                    UIRenderer.showToast('请输入标签名称', 'error');
                    return;
                }
                
                const newTag = TagStorage.addTag(tagName);
                if (newTag) {
                    document.getElementById('new-tag-input').value = '';
                    UIRenderer.renderAllTags(); // 刷新管理标签模态框
                    this.refreshAllUI(); // 刷新主页标签栏和网页列表
                    UIRenderer.showToast(`已添加标签: ${newTag.name}`);
                } else {
                    UIRenderer.showToast('标签已存在', 'error');
                }
            },
            
            // 删除标签
            deleteTag(tagId) {
                const deletedTag = TagStorage.deleteTag(tagId);
                if (deletedTag) {
                    // 删除标签后要检查当前筛选标签是否为被删除的标签
                    if (this.state.activeTagId === tagId) {
                        this.state.activeTagId = 'all'; // 切换到 '全部'
                    }

                    UIRenderer.renderAllTags(); // 刷新管理标签模态框
                    this.refreshAllUI(); // 刷新主页标签栏和网页列表
                    UIRenderer.showToast(`已删除标签: ${deletedTag.name}`);
                }
            },
            
            // 向添加的网页添加标签
            addTagToWeb(tagId) {
                if (!this.state.addWebTags.includes(tagId)) {
                    this.state.addWebTags.push(tagId);
                    UIRenderer.renderAddWebTags(this.state.addWebTags);
                }
            },
            
            // 从添加的网页移除标签
            removeTagFromWeb(tagId) {
                this.state.addWebTags = this.state.addWebTags.filter(id => id !== tagId);
                UIRenderer.renderAddWebTags(this.state.addWebTags);
            },
            
            // 向编辑的网页添加标签
            addTagToEditWeb(tagId) {
                if (!this.state.editWebTags.includes(tagId)) {
                    this.state.editWebTags.push(tagId);
                    UIRenderer.renderEditWebTags(this.state.editWebTags);
                }
            },
            
            // 从编辑的网页移除标签
            removeTagFromEditWeb(tagId) {
                this.state.editWebTags = this.state.editWebTags.filter(id => id !== tagId);
                UIRenderer.renderEditWebTags(this.state.editWebTags);
            },
            
            // 根据标签筛选
            filterByTag(tagId) {
                this.state.activeTagId = tagId;
                this.refreshAllUI(); // 统一调用刷新
            },
            
            // 更新搜索UI
            updateSearchUI() {
                this.refreshAllUI(); // 统一调用刷新
            },
            
            // 清除搜索
            clearSearch() {
                document.getElementById('search-input').value = '';
                document.getElementById('clear-search').classList.add('hidden');
                this.state.searchTerm = '';
                this.refreshAllUI(); // 调用统一刷新
            },
            
            // 【新增 E-2】一键复制代码
            copyCode() {
                const codeViewArea = document.getElementById('code-view-area');
                const codeEditInput = document.getElementById('edit-html-code-input');
                let codeToCopy = '';

                // 判断当前显示的是查看区域还是编辑区域
                if (!document.getElementById('code-edit-area').classList.contains('hidden')) {
                    // 显示的是编辑区域
                    codeToCopy = codeEditInput.value;
                } else {
                    // 显示的是查看区域
                    codeToCopy = codeViewArea.textContent;
                }

                if (!codeToCopy) {
                    UIRenderer.showToast('代码区域为空', 'error');
                    return;
                }

                // 复制逻辑
                navigator.clipboard.writeText(codeToCopy).then(() => {
                    UIRenderer.showToast('代码已复制到剪贴板！', 'success');
                }).catch(err => {
                    console.error('复制失败:', err);
                    UIRenderer.showToast('代码复制失败，请手动复制。', 'error');
                });
            },

            // 【新增 E-3】全屏打开代码
            openFullscreenCode() {
                const webId = document.getElementById('edit-web-id').value;
                const web = WebStorage.getWebById(webId);
                if (!web) return;

                const isViewing = document.getElementById('code-edit-area').classList.contains('hidden');
                
                // 1. 设置全屏模态框标题
                document.getElementById('fullscreen-code-title').textContent = `${web.title} - 代码 (${isViewing ? '查看' : '编辑'})`;

                // 2. 同步数据和模式
                const fullView = document.getElementById('fullscreen-code-view');
                const fullEditArea = document.getElementById('fullscreen-code-edit');
                const fullEditInput = document.getElementById('fullscreen-html-code-input');
                const currentEditInput = document.getElementById('edit-html-code-input');
                const currentViewArea = document.getElementById('code-view-area');

                if (isViewing) {
                    // 查看模式
                    fullView.textContent = currentViewArea.textContent;
                    fullView.classList.remove('hidden');
                    fullEditArea.classList.add('hidden');
                } else {
                    // 编辑模式
                    fullEditInput.value = currentEditInput.value;
                    fullView.classList.add('hidden');
                    fullEditArea.classList.remove('hidden');
                }

                // 3. 显示全屏模态框
                document.getElementById('code-fullscreen-modal').classList.remove('hidden');
            },

            // 【新增 E-3】关闭全屏代码
            closeFullscreenCode() {
                const fullEditInput = document.getElementById('fullscreen-html-code-input');
                const currentEditInput = document.getElementById('edit-html-code-input');
                const fullEditArea = document.getElementById('fullscreen-code-edit');
                const currentViewArea = document.getElementById('code-view-area');
                
                // 如果当前处于全屏编辑模式，则同步数据回主编辑框和查看区域
                if (!fullEditArea.classList.contains('hidden')) {
                    currentEditInput.value = fullEditInput.value;
                    currentViewArea.textContent = fullEditInput.value; // 同步给查看区域
                }
                
                document.getElementById('code-fullscreen-modal').classList.add('hidden');
            },

            // 【新增】兼容模式复制函数，用于解决 navigator.clipboard 失败的问题 (BUG 2 修复的一部分)
            _fallbackCopyTextToClipboard(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
            
                // 避免在屏幕上显示
                textArea.style.position = "fixed";
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.width = "2em";
                textArea.style.height = "2em";
                textArea.style.padding = "0";
                textArea.style.border = "none";
                textArea.style.outline = "none";
                textArea.style.boxShadow = "none";
                textArea.style.background = "transparent";

                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        UIRenderer.showToast('代码已复制到剪贴板！', 'success');
                    } else {
                        throw new Error('execCommand 复制失败');
                    }
                } catch (err) {
                    console.error('兼容模式复制失败:', err);
                    UIRenderer.showToast('代码复制失败，请手动复制。', 'error');
                }

                document.body.removeChild(textArea);
            },
        
        };

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            UIManager.init();
        });
    </script>
</body>

</html>
